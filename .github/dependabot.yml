version: 2

# The dependency list is a promise this library makes. A Go SDK for a wire protocol
# should be reachable from a program that already depends on very little, so the
# list stays short on purpose and an addition is a design decision rather than a
# convenience. That makes an automated bump safe to look at: it moves a version.
updates:
  - package-ecosystem: npm
    # The Markdown toolchain lives beside the Go module rather than on top of it.
    directory: /.docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      documentation-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: docs

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
