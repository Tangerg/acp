version: "2"

# Lint configuration for the module.
#
# The enabled set is deliberately much broader than golangci-lint's default six.
# This file exists so the standard is enforced on every push rather than
# re-established by hand: a finding is either fixed, or suppressed at the exact
# line with a comment saying why. No linter that found real code is disabled
# wholesale.

run:
  # Tests are where most of this repository's claims are actually stated, so they
  # are held to the same standard as the code they describe.
  tests: true

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - goprintffuncname
    - gosec
    - govet
    - iface
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - makezero
    - maintidx
    - mirror
    - misspell
    - modernize
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - revive
    - staticcheck
    - tagalign
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace

  settings:
    govet:
      # Includes shadow, so the zero-shadowing property is enforced rather than
      # periodically restored.
      enable-all: true
      disable:
        # Field order in the protocol types is chosen to read as documentation and
        # to match the published schema's own ordering, so a reader can hold one
        # against the other. Reordering for padding would trade that for a few
        # bytes per message.
        - fieldalignment

    exhaustive:
      # The protocol's string enumerations are open by design: a peer may send a
      # variant from a later revision, and a default case is how this package
      # refuses it rather than silently ignoring it.
      default-signifies-exhaustive: true

    goconst:
      # Tests repeat values in readable case tables on purpose and are excluded
      # below. Ignoring them while counting too stops a test-only repetition from
      # reporting the sole real occurrence.
      ignore-tests: true
      # Equal strings in separate messages are not the same concept. Only
      # repetitions that can drift apart should share a constant.
      match-constant: false

    gocognit:
      # A function above this line is doing more than one readable job. Tests use
      # deliberate case tables and fault scripts, so the production-only rule is
      # selected below.
      min-complexity: 30

    gocyclo:
      min-complexity: 30

    recvcheck:
      # Reading a value and writing one are not the same receiver, and the wire
      # encoding needs both: MarshalJSON reads, and json.Unmarshaler cannot be
      # satisfied without a pointer. It is what time.Time and net.IP do, and the
      # alternative is a value type nobody can decode into.
      #
      # MarshalJSON is listed even though the Unmarshal side is built in: the
      # built-in set covers only the decoding half, so without this every
      # generated protocol type reports the mix its json interfaces require. The
      # value receiver on it is load-bearing rather than stylistic — an optional
      # property holds its value, not a pointer to one, so a pointer-receiver
      # encoder would never be found and the default struct encoding would
      # silently replace it.
      exclusions:
        - "*.MarshalJSON"
        - "*.UnmarshalJSON"
        - "*.UnmarshalText"

    nolintlint:
      # A suppression is a claim that the linter is wrong. It has to name the rule
      # it disables and say why, or it is indistinguishable from silencing a real
      # finding.
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    # Generated files are code too. Protocol types generated from the published
    # schema are the ones most worth linting, so the implicit exclusion is off from
    # the day the first one appears.
    generated: disable
    warn-unused: true
    rules:
      # A failed assertion in a test is a test failure with a stack trace pointing
      # at the assertion. The comma-ok form would add a branch that can only ever
      # report the same thing less directly.
      - path: _test\.go
        linters:
          - forcetypeassert

      # Production functions have one readable responsibility. Table-driven tests
      # and fault scripts deliberately combine many cases; splitting those would
      # hide the complete contract they audit.
      - path: _test\.go
        linters:
          - gocognit
          - gocyclo
          - maintidx

      # revive's exported rule asks every exported identifier for a doc comment.
      # That is the right default and it stays on, but it cannot tell a comment
      # that carries a reason from one that repeats the name. These methods mean
      # exactly what a Go reader already knows they mean — the codec pair, the
      # conventional accessors, and the two collection listings — so a comment on
      # one could only say what the signature says. Where such a method does
      # something surprising, the surprise is documented on the type that owns it
      # or inline at the line that causes it.
      - text: "exported: exported (method|function) [A-Za-z.]*(MarshalJSON|UnmarshalJSON|OptValue|IsNull|Len|Delete|Conns|ID|Conn|Session)"
        linters:
          - revive

      # internal/jsonrpc2 is a fork of golang.org/x/tools/internal/jsonrpc2_v2,
      # kept as close to upstream as the removals in its doc.go allow. Its
      # comment style and its one error type assertion are upstream's, and
      # rewriting them would make the diff against upstream unreadable — which is
      # the only thing that makes a fork maintainable when upstream moves.
      - path: internal/jsonrpc2/
        linters:
          - errorlint
          - revive
          - godot

      # The generated protocol types stay in the lint gate — see `generated:
      # disable` above — and every linter that measures a decision somebody made
      # still applies to them. These four do not measure a decision.
      #
      # dupl reports that two types with the same property shapes produce the
      # same code. That is the generator's contract, not a maintenance hazard:
      # there is one place to change, and factoring the repetition out would mean
      # emitting helpers whose only purpose is to defeat a duplication metric.
      #
      # The three complexity metrics report the number of properties the schema
      # gives a type. A decoder has one branch per property because each one
      # recovers, defaults or fails on its own, and the alternative is one method
      # per property — more code, more indirection, and the same total.
      #
      # goconst reports that a union's arms name the same JSON type in their own
      # case clauses — "string" appearing once per arm that accepts a string. Those
      # are the schema's words at the position the schema puts them, not a repeated
      # decision, and hoisting them would have the generator emit a const block
      # whose only purpose is to lower a count.
      - path: \.gen\.go
        linters:
          - dupl
          - goconst
          - gocognit
          - gocyclo
          - maintidx

issues:
  # Truncating output turns "clean" into "clean as far as we looked".
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: disable
